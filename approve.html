<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Petty Cash Approval</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
        .loader {
            border-top-color: #0ea5e9;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col max-w-lg mx-auto w-full bg-white shadow-xl relative overflow-hidden">
        
        <!-- Header -->
        <header class="bg-gradient-to-r from-green-600 to-green-500 text-white p-6 shadow-md rounded-b-3xl z-10 relative">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">อนุมัติวงเงินสดย่อย</h1>
                    <p class="text-green-100 text-sm mt-1" id="userNameDisplay">กำลังตรวจสอบสิทธิ์...</p>
                </div>
                <!-- Back Button for Detail View -->
                <div id="backBtn" onclick="showState('batchList')" class="hidden w-10 h-10 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm cursor-pointer hover:bg-white/30 transition">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-4 pb-32 bg-slate-50 relative z-0" id="mainContent">
            
            <!-- Loading State -->
            <div id="loadingState" class="flex flex-col items-center justify-center h-full space-y-4">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
                <p class="text-slate-500 font-medium">กำลังโหลดข้อมูล...</p>
            </div>

            <!-- Error State -->
            <div id="errorState" class="hidden flex flex-col items-center justify-center h-full p-6 text-center">
                <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <h3 class="text-lg font-bold text-slate-800" id="errorTitle">เกิดข้อผิดพลาด</h3>
                <p class="text-slate-600 mt-2" id="errorMessage"></p>
                <button onclick="fetchPendingBatches()" class="mt-6 px-6 py-2 bg-slate-200 text-slate-700 rounded-full font-medium hover:bg-slate-300 transition">ลองใหม่</button>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden flex flex-col items-center justify-center h-full p-6 text-center">
                <div class="w-24 h-24 mb-4">
                    <svg class="text-slate-300 w-full h-full" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <h3 class="text-lg font-bold text-slate-800">ไม่มีรายการรออนุมัติ</h3>
            </div>

            <!-- Batch List -->
            <div id="batchListContainer" class="hidden space-y-4">
                <!-- Template injected here -->
            </div>

            <!-- Batch Detail (Bills) -->
            <div id="batchDetailContainer" class="hidden space-y-4">
                <!-- Info Header -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 mb-4">
                    <h3 class="font-bold text-slate-800" id="detailHolderName"></h3>
                    <p class="text-sm text-slate-500 mt-1">เวลาที่สร้าง: <span id="detailCreateTime"></span></p>
                    <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-100">
                        <span class="text-sm text-slate-500">รวม <span id="detailBillCount" class="font-bold"></span> รายการ</span>
                        <span class="text-lg font-black text-brand-600" id="detailTotalAmount"></span>
                    </div>
                </div>
                <!-- Bills List -->
                <div id="billsList" class="space-y-3"></div>
            </div>
            
            <div class="h-48 w-full"></div>
        </main>

        <!-- Bottom Action Bar -->
        <div id="actionBar" class="hidden absolute bottom-0 left-0 w-full bg-white border-t border-slate-200 p-4 pb-safe shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-20 transition-transform duration-300 transform translate-y-full">
            <div class="flex gap-3">
                <button onclick="confirmReject()" class="flex-1 bg-red-100 text-red-600 font-bold py-4 rounded-2xl shadow-sm hover:bg-red-200 transition transform active:scale-95">
                    ตีกลับ (Reject)
                </button>
                <button onclick="confirmApprove()" class="flex-[2] bg-green-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-green-700 transition transform active:scale-95">
                    อนุมัติ (Approve)
                </button>
            </div>
        </div>
        
        <!-- Processing Overlay -->
        <div id="processingOverlay" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-brand-500 h-16 w-16 mb-6"></div>
            <h3 class="text-xl font-bold text-slate-800">กำลังประมวลผล</h3>
            <p class="text-slate-500 mt-2 text-center px-8">ระบบกำลังอัปเดตข้อมูล กรุณารอสักครู่...</p>
        </div>
        
        <!-- Success Overlay -->
        <div id="successOverlay" class="hidden absolute inset-0 bg-green-600 z-50 flex flex-col items-center justify-center text-white">
            <div class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mb-6">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h3 class="text-2xl font-bold mb-2">ดำเนินการสำเร็จ!</h3>
            <p class="text-green-100 text-center px-8 mb-8" id="successMessage"></p>
            <button onclick="closeOrReload()" class="px-6 py-2 bg-white text-green-600 rounded-full font-bold shadow-lg">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- Template for Batch Card -->
    <template id="batchCardTemplate">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 transition cursor-pointer hover:shadow-md hover:border-brand-200" onclick="viewBatch(this.dataset.id)">
            <div class="flex justify-between items-start mb-2">
                <h3 class="font-bold text-slate-800 batch-holder text-lg"></h3>
                <span class="bg-amber-100 text-amber-700 text-xs px-2 py-1 rounded-md font-bold">รออนุมัติ</span>
            </div>
            <p class="text-sm text-slate-500 mb-3 batch-date"></p>
            <div class="flex justify-between items-center border-t border-slate-100 pt-3">
                <span class="text-sm text-slate-500 batch-count"></span>
                <span class="font-black text-brand-600 text-lg batch-amount"></span>
            </div>
        </div>
    </template>

    <!-- Template for Read-only Bill -->
    <template id="billDetailTemplate">
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-3 flex gap-4 items-center">
            <div class="w-14 h-14 rounded-lg bg-slate-100 border border-slate-200 flex-shrink-0 flex items-center justify-center overflow-hidden">
                <img src="" class="bill-img w-full h-full object-cover hidden" alt="bill" onerror="this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden');">
                <svg class="bill-icon w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
            <div class="flex-1 min-w-0">
                <p class="bill-project text-slate-800 font-bold truncate text-base">Project</p>
                <p class="bill-remark text-sm text-slate-600 line-clamp-2">Remark</p>
                <p class="bill-date text-xs text-slate-400 mt-1">Date</p>
            </div>
            <div class="text-right flex-shrink-0">
                <p class="bill-amount text-brand-600 font-black text-base">฿0.00</p>
                <a href="#" target="_blank" class="bill-link text-[10px] text-blue-500 underline hidden">ดูรูปเต็ม</a>
            </div>
        </div>
    </template>

    <script>
        const LIFF_ID = '2009016720-KCCaDCdH'; 
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLRd7vwI-qNqrzM0XkaBq6e2484U6nWMFr5lskp75M-OyiCwtG22QOW0itfsyqro5F7g/exec";

        let currentUserUid = null;
        let batchesData = [];
        let currentBatchId = null;

        async function initializeApp() {
            showState('loading');
            try {
                if(LIFF_ID && LIFF_ID.length > 5 && LIFF_ID.indexOf('?') === -1) {
                    await liff.init({ liffId: LIFF_ID });
                    if (!liff.isLoggedIn()) {
                        liff.login({ redirectUri: window.location.href });
                        return;
                    }
                    const profile = await liff.getProfile();
                    currentUserUid = profile.userId;
                    document.getElementById('userNameDisplay').textContent = profile.displayName;
                } else {
                    // Fallback for direct testing
                    currentUserUid = 'TEST_APPROVER_UID';
                }
                
                fetchPendingBatches();
            } catch (err) {
                showError('ไม่สามารถเข้าสู่ระบบได้', err.message);
            }
        }

        async function callBackend(action, payload) {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: action, ...payload })
            });
            const result = await response.json();
            if (!result.success) throw new Error(result.message);
            return result.data;
        }

        async function fetchPendingBatches() {
            showState('loading');
            try {
                const data = await callBackend('getPendingBatches', { lineUid: currentUserUid });
                batchesData = data;
                renderBatches();
            } catch (error) {
                showError('การเข้าถึงถูกปฏิเสธ หรือมีข้อผิดพลาด', error.message);
            }
        }

        function renderBatches() {
            const container = document.getElementById('batchListContainer');
            const template = document.getElementById('batchCardTemplate');
            container.innerHTML = '';
            
            if (!batchesData || batchesData.length === 0) {
                showState('empty');
                return;
            }

            batchesData.forEach(batch => {
                const clone = template.content.cloneNode(true);
                clone.querySelector('div').dataset.id = batch.batch_id;
                clone.querySelector('.batch-holder').textContent = batch.holder_name;
                
                let dateText = batch.create_datetime;
                try { 
                    const d = new Date(batch.create_datetime);
                    if(!isNaN(d)) dateText = d.toLocaleString('th-TH');
                } catch(e) {}
                clone.querySelector('.batch-date').textContent = `วันที่ขอ: ${dateText}`;
                clone.querySelector('.batch-count').textContent = `${batch.bill_count} บิล`;
                clone.querySelector('.batch-amount').textContent = `฿${parseFloat(batch.total_amount).toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
                
                container.appendChild(clone);
            });
            showState('batchList');
        }

        async function viewBatch(batchId) {
            currentBatchId = batchId;
            const batch = batchesData.find(b => String(b.batch_id) === String(batchId));
            if (!batch) return;

            showState('loading');
            
            try {
                const bills = await callBackend('getBatchDetails', { lineUid: currentUserUid, batchId: batchId });
                
                document.getElementById('detailHolderName').textContent = `ผู้ขอเบิก: ${batch.holder_name}`;
                document.getElementById('detailCreateTime').textContent = new Date(batch.create_datetime).toLocaleString('th-TH');
                document.getElementById('detailBillCount').textContent = bills.length;
                document.getElementById('detailTotalAmount').textContent = `฿${parseFloat(batch.total_amount).toLocaleString('th-TH', {minimumFractionDigits: 2})}`;

                const list = document.getElementById('billsList');
                const template = document.getElementById('billDetailTemplate');
                list.innerHTML = '';

                bills.forEach(bill => {
                    const clone = template.content.cloneNode(true);
                    clone.querySelector('.bill-project').textContent = bill.project || 'ไม่ระบุโปรเจกต์';
                    
                    let dateText = bill.doc_date;
                    try { 
                        if(bill.doc_date) {
                            const d = new Date(bill.doc_date);
                            if(!isNaN(d)) dateText = d.toLocaleDateString('th-TH');
                        }
                    } catch(e) {}
                    
                    const vendor = bill.vend_name ? `ร้าน: ${bill.vend_name}` : '';
                    clone.querySelector('.bill-remark').textContent = bill.remark || vendor || '-';
                    clone.querySelector('.bill-date').textContent = `วันที่: ${dateText}`;
                    clone.querySelector('.bill-amount').textContent = `฿${parseFloat(bill.net).toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
                    
                    if (bill.pic_bill) {
                        const img = clone.querySelector('.bill-img');
                        const firstUrl = String(bill.pic_bill).split(',')[0].trim();
                        img.src = firstUrl;
                        img.classList.remove('hidden');
                        clone.querySelector('.bill-icon').classList.add('hidden');
                        
                        const link = clone.querySelector('.bill-link');
                        link.href = firstUrl;
                        link.classList.remove('hidden');
                    }
                    list.appendChild(clone);
                });

                showState('batchDetail');
            } catch (error) {
                showError('ไม่สามารถดึงรายละเอียดได้', error.message);
            }
        }

        async function confirmApprove() {
            if(!confirm('ยืนยันการ "อนุมัติ" รายการนี้? \nระบบจะสร้างเอกสาร PDF และส่งอีเมลแจ้งเตือนไปยังแผนกบัญชี')) return;
            processAction('approveBatchAction');
        }

        async function confirmReject() {
            if(!confirm('ยืนยันการ "ตีกลับ" รายการนี้? \nรายการจะถูกส่งคืนให้ผู้ขอเบิกแก้ไข')) return;
            processAction('rejectBatchAction');
        }

        async function processAction(actionName) {
            document.getElementById('processingOverlay').classList.remove('hidden');
            try {
                const data = await callBackend(actionName, { lineUid: currentUserUid, batchId: currentBatchId });
                document.getElementById('processingOverlay').classList.add('hidden');
                
                const batch = batchesData.find(b => String(b.batch_id) === String(currentBatchId));
                let totalAmount = batch ? parseFloat(batch.total_amount) : 0;
                
                const msg = document.getElementById('successMessage');
                let liffText = '';

                if (actionName === 'approveBatchAction') {
                    msg.innerHTML = `รายการได้รับการอนุมัติเรียบร้อยแล้ว<br>PDF ถูกสร้างและส่งอีเมลแจ้งบัญชีแล้ว`;
                    liffText = `อนุมัติวงเงินสดย่อยสำเร็จ!\nผู้ขอเบิก: ${batch.holder_name}\nยอดรวม: ฿${totalAmount.toLocaleString('th-TH', {minimumFractionDigits: 2})}\nเอกสาร PDF: ${data.pdf_url}`;
                } else {
                    document.getElementById('successOverlay').classList.replace('bg-green-600', 'bg-slate-700');
                    msg.innerHTML = `รายการถูกตีกลับเรียบร้อยแล้ว`;
                    liffText = `ตีกลับรายการวงเงินสดย่อยแล้ว!\nผู้ขอเบิก: ${batch.holder_name}\nยอดรวม: ฿${totalAmount.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
                }
                
                document.getElementById('successOverlay').classList.remove('hidden');

                if (typeof liff !== 'undefined' && liff.isInClient()) {
                    liff.sendMessages([{ type: 'text', text: liffText }])
                        .then(() => {
                            setTimeout(() => liff.closeWindow(), 3000);
                        })
                        .catch(err => {
                            alert('ส่งข้อความเข้า LINE ไม่สำเร็จ (LIFF Error): ' + err.message + '\n\nอาจเป็นเพราะคุณเปิดลิงก์โดยตรง ไม่ได้ผ่าน LIFF URL หรือไม่ได้เปิดสิทธิ์ส่งข้อความใน LIFF Developer ครับ');
                            setTimeout(() => liff.closeWindow(), 5000);
                        });
                } else {
                    setTimeout(() => window.location.reload(), 3000);
                }
            } catch (error) {
                document.getElementById('processingOverlay').classList.add('hidden');
                alert('ข้อผิดพลาด: ' + error.message);
            }
        }

        function showState(state) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('errorState').classList.add('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('batchListContainer').classList.add('hidden');
            document.getElementById('batchDetailContainer').classList.add('hidden');
            document.getElementById('backBtn').classList.add('hidden');
            hideActionBar();

            if (state === 'loading') document.getElementById('loadingState').classList.remove('hidden');
            if (state === 'error') document.getElementById('errorState').classList.remove('hidden');
            if (state === 'empty') document.getElementById('emptyState').classList.remove('hidden');
            if (state === 'batchList') document.getElementById('batchListContainer').classList.remove('hidden');
            if (state === 'batchDetail') {
                document.getElementById('batchDetailContainer').classList.remove('hidden');
                document.getElementById('backBtn').classList.remove('hidden');
                showActionBar();
            }
        }

        function showError(title, message) {
            document.getElementById('errorTitle').textContent = title;
            document.getElementById('errorMessage').textContent = message;
            showState('error');
        }
        
        function closeOrReload() {
            if (typeof liff !== 'undefined' && liff.isInClient()) {
                liff.closeWindow();
            } else {
                window.location.reload();
            }
        }

        let actionTimeout = null;

        function showActionBar() {
            const bar = document.getElementById('actionBar');
            if(actionTimeout) clearTimeout(actionTimeout);
            bar.classList.remove('hidden');
            actionTimeout = setTimeout(() => { bar.classList.remove('translate-y-full'); }, 50);
        }

        function hideActionBar() {
            const bar = document.getElementById('actionBar');
            if(actionTimeout) clearTimeout(actionTimeout);
            bar.classList.add('translate-y-full');
            actionTimeout = setTimeout(() => { bar.classList.add('hidden'); }, 300);
        }

        document.addEventListener('DOMContentLoaded', initializeApp);
        
        if (CSS.supports('padding-bottom: env(safe-area-inset-bottom)')) {
            document.head.insertAdjacentHTML('beforeend', '<style>.pb-safe { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }</style>');
        }
    </script>
</body>
</html>
